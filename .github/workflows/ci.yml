name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check project documents, skills and tracked files
        run: python3 scripts/check_repository.py

  build:
    name: Build application and run test suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build package artifact
        run: |
          python -m pip install --upgrade pip
          python -m pip wheel --no-deps -w dist .
          python -m pip install dist/*.whl
      - name: Verify application startup and package imports
        run: python -c "import app, app.server, app.service"
      - name: Run unit and integration tests (SQLite default; live PostgreSQL skipped in CI)
        run: python -W error::ResourceWarning -m unittest discover -s tests -v

  v3:
    name: V3 production slice
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Install locked API dependencies and check transport parity
        run: |
          python -m pip install uv
          uv sync --locked --extra v3
          uv run --locked --extra v3 python -m unittest discover -s tests -p test_v3_transport.py -v
      - name: Build, typecheck and exercise the real browser flow
        working-directory: web
        run: |
          npm ci
          npm run build
          npm run typecheck
          npx playwright install --with-deps chromium
          npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marketstudio-v3-browser-evidence
          path: web/test-results/
